; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200

; Board is the physical N16R8 variant (16MB flash, 8MB PSRAM), but the
; esp32-s3-devkitc-1 manifest defaults to N8/no-PSRAM. An earlier attempt to
; override this with memory_type=qio_opi caused a boot loop; ROM boot logs
; consistently reported "mode:DIO", i.e. this board's flash is wired DIO, not
; QIO, so qio_opi was requesting a bus mode the hardware doesn't support.
; dio_opi (DIO flash + Octal PSRAM) fixed the boot loop and correctly reports
; 16MB flash, but PSRAM: found=no - this module is ESP32-S3-WROOM-1-N16R8
; (no "V" suffix), which uses Quad SPI PSRAM, not Octal. Trying dio_qspi
; (DIO flash + Quad PSRAM) instead.
board_upload.flash_size = 16MB
board_build.flash_mode = dio
board_build.arduino.memory_type = dio_qspi

build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	adafruit/Adafruit MPU6050 @ ^2.2.4
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BusIO @ ^1.14.1
