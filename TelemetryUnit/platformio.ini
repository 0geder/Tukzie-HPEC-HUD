; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Two builds of the same source (v0.7.5):
;  - esp32-s3-devkitc-1: the rear unit on the Makerfabs A7670X board (two
;    IMUs, modem, GNSS, MQTT, BLE BMS, flash log). The default, so a plain
;    "pio run" or upload only ever builds and flashes this one.
;  - front_node: the front IMU node on a generic ESP32-S3 dev board, one IMU
;    and nothing else. Build with "pio run -e front_node".
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
upload_port = COM10
monitor_port = COM10
monitor_speed = 115200

; The TF/microSD card slot's CS line traces to GPIO10 only through R23 on
; the schematic, and R23 is marked NC (not populated) - meaning there is
; likely no electrical path from any GPIO to the card's chip-select as
; assembled. Rather than target an interface that may not physically exist
; (confirmed by reading the schematic, not assumed), local logging uses the
; chip's own internal flash instead: confirmed present and working (this is
; the same 16MB chip IMU calibration already persists to via NVS), needs no
; new wiring, and a real bundled partition table exists for it.
board_build.partitions = default_16MB.csv
board_build.filesystem = littlefs

; The flash_size/memory_type overrides below were reverse-engineered
; specifically from the Makerfabs A7670X board's own ROM boot logs
; ("mode:DIO"). As of 2026-09-18, testing has moved to a DIFFERENT physical
; board (a bare ESP32-S3 dev board, not the Makerfabs one) - even though it
; is spec'd the same on paper (16MB flash/8MB PSRAM), its actual flash bus
; wiring has not been verified and may differ by vendor. Given the wrong
; memory_type setting caused a genuine boot loop earlier on the Makerfabs
; board, these overrides are commented out rather than reused blindly on
; unfamiliar hardware. Re-enable (with re-verification via the ROM boot log)
; once/if this bare board's own flash wiring is confirmed.
;
; 2026-09-25, back on the Makerfabs board: the 16MB partition table above
; boot-looped (RTC_SW_SYS_RST straight after the ROM hands over to the
; bootloader) with the flash size left at the devkit default of 8MB. The flash
; size and DIO mode are re-enabled to match the table and the ROM banner's
; "mode:DIO". memory_type stays commented out: it is the setting implicated in
; the earlier boot loop, and PSRAM is not used by this firmware.
board_upload.flash_size = 16MB
board_build.flash_mode = dio
; board_build.arduino.memory_type = dio_qspi

; This project alternates between two different physical boards with
; opposite Serial routing needs:
;  - Bare ESP32-S3 dev board: only connected USB-C goes through a CH343
;    USB-to-UART bridge, carrying hardware UART0 - the same path the ROM
;    bootloader log uses. Needs these flags OFF (Serial = UART0).
;  - Makerfabs A7670X board: has three separate USB-C ports (native USB,
;    USB-TTL via an onboard CH340K on UART0, and a modem-only port). The
;    ROM boot log always goes out the native USB port regardless of these
;    flags, but without ARDUINO_USB_CDC_ON_BOOT, application Serial output
;    is routed to UART0 -> CH340K -> the *separate* USB-TTL port, which is
;    silent if the native port is what's actually plugged in. Needs these
;    flags ON (Serial = native USB) to match the native port.
; Verify which board is connected before building - re-toggle these if
; switching boards and getting no application output past the ROM banner.
build_flags =
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
	adafruit/Adafruit MPU6050 @ ^2.2.4
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BusIO @ ^1.14.1

; Front IMU node (v0.7.5): src/main.cpp built with NODE_FRONT=1. One IMU,
; no modem, no BLE, no GNSS, no MQTT, no flash log. DASH (fewer fields) and
; the raw stream go out on USB serial; add -D LINK_UART_ENABLE=1 to send them
; on a UART too (pins LINK_UART_TX_PIN / LINK_UART_RX_PIN, 41 and 42 unless
; set here). The board is not confirmed yet: these settings assume an
; ESP32-S3-DevKitC-1 type board, IMU on its default I2C pins (SDA 8, SCL 9),
; sync output on GPIO15. Change the -D pin flags below to match the board.
; No upload_port: set it once the board's COM port is known, so it can never
; be flashed onto the rear unit's COM10 by mistake.
; USB: the two flags below route Serial to the native USB port (the one
; marked USB on a DevKitC-1). If the board is plugged in by its UART port
; (CH343 or CP210x bridge) instead, remove them.
[env:front_node]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
	-D NODE_FRONT=1
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D IMU1_SDA_PIN=8
	-D IMU1_SCL_PIN=9
	-D SYNC_PULSE_PIN=15
lib_deps =
	adafruit/Adafruit MPU6050 @ ^2.2.4
	adafruit/Adafruit Unified Sensor @ ^1.1.14
	adafruit/Adafruit BusIO @ ^1.14.1
